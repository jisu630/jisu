<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif">
  <rect width="920" height="440" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="918" height="438" rx="15" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <text x="32" y="44" font-size="21" font-weight="700" fill="#1f2328">직결 모드 — "OO PC에서 작업할게"</text>
  <text x="32" y="68" font-size="13" fill="#57606a">사령탑이 요약을 멈추고 투명한 통로가 됩니다. 입력이 그대로 그 PC의 Claude에게 전달됩니다.</text>

  <!-- lifelines -->
  <text x="130" y="104" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">사용자</text>
  <text x="460" y="104" font-size="13" font-weight="700" fill="#0ea5e9" text-anchor="middle">사령탑 Claude</text>
  <text x="790" y="104" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">대상 PC 세션</text>
  <line x1="130" y1="116" x2="130" y2="400" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="460" y1="116" x2="460" y2="400" stroke="#d0d7de" stroke-width="1.4"/>
  <line x1="790" y1="116" x2="790" y2="400" stroke="#d0d7de" stroke-width="1.4"/>

  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#57606a"/></marker>
  </defs>

  <!-- step 1 -->
  <line x1="130" y1="150" x2="456" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="290" y="142" font-size="11.5" fill="#3b3f45" text-anchor="middle">"hospital-pc로 직결해줘"</text>

  <!-- commander confirms target -->
  <rect x="360" y="164" width="200" height="30" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
  <text x="460" y="184" font-size="10.5" fill="#0e6ba8" text-anchor="middle">/api/fleet 로 대상 확정·세션 준비</text>
  <line x1="460" y1="210" x2="130" y2="210" stroke="#0ea5e9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m)"/>
  <text x="290" y="204" font-size="11" fill="#0ea5e9" text-anchor="middle">🔗 직결 시작 안내</text>

  <!-- step 2 pass-through -->
  <line x1="130" y1="248" x2="786" y2="248" stroke="#57606a" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="330" y="240" font-size="11.5" fill="#3b3f45" text-anchor="middle">매 메시지를 그대로 /api/prompt 전달 (요약·수정 없음)</text>

  <!-- turn running -->
  <rect x="700" y="262" width="180" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="790" y="281" font-size="10.5" fill="#15803d" text-anchor="middle">그 PC의 Claude가 턴 실행</text>

  <!-- step 3 return raw -->
  <line x1="790" y1="312" x2="134" y2="312" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#m)"/>
  <text x="440" y="306" font-size="11.5" fill="#15803d" text-anchor="middle">[턴 완료] 까지 대기 후 새 출력을 전문 그대로 표시</text>

  <!-- step 4 end -->
  <line x1="130" y1="352" x2="456" y2="352" stroke="#57606a" stroke-width="1.6" marker-end="url(#m)"/>
  <text x="290" y="344" font-size="11.5" fill="#3b3f45" text-anchor="middle">"직결 종료"</text>
  <line x1="460" y1="380" x2="130" y2="380" stroke="#0ea5e9" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#m)"/>
  <text x="290" y="374" font-size="11" fill="#0ea5e9" text-anchor="middle">"사령탑으로 복귀했습니다"</text>

  <text x="600" y="352" font-size="11" fill="#57606a">세션은 그 PC에 살아 있어</text>
  <text x="600" y="368" font-size="11" fill="#57606a">언제든 다시 직결·딥링크 가능</text>
</svg>
